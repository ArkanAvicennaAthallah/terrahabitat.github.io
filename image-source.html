
<!DOCTYPE html>

    <title>Image Source | TerraHabitat</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .image-source-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 24px;
        }

        .image-source-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .image-source-heading h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .image-source-heading p {
            color: #777;
            font-size: 0.95rem;
        }

        .image-source-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .image-source-item {
            display: block;
            overflow: hidden;
            border-radius: 12px;
            background: #f2f2f2;
            aspect-ratio: 4 / 3;
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .image-source-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .image-source-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.15);
        }

        .image-source-item:hover img {
            transform: scale(1.06);
        }

        @media (max-width: 768px) {
            .image-source-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .image-source-page {
                padding: 35px 16px;
            }
        }

        @media (max-width: 420px) {
            .image-source-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
